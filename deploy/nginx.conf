# One Cache-Control per path, so every location inherits the same server-level headers.
map $uri $kevinsstuff_cache {
    /release.json                                                       "no-store";
    ~*\.(?:css|js|mjs|svg|png|jpe?g|webp|avif|gif|ico|woff2?|mp4|webm)$ "public, max-age=3600";
    default                                                             "no-cache";
}

server {
    listen 8080;
    server_name _;
    # `current` is a symlink the receiver swaps atomically to the newest release.
    root /srv/site/current;
    index index.html;
    server_tokens off;
    # Behind the HTTPS edge an absolute redirect would name this container's http://…:8080.
    absolute_redirect off;

    add_header Cache-Control $kevinsstuff_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
